name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows Installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:win

      - name: Locate installer
        id: locate
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path dist -Filter 'Printventory-Setup-*.exe' -File |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) {
            Write-Error "No Printventory-Setup-*.exe found in dist/"
            exit 1
          }
          Write-Host "Found installer: $($exe.FullName)"
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "filename=$($exe.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate.outputs.filename }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error
          retention-days: 30
